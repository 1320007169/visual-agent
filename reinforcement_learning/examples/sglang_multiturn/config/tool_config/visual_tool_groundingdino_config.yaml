tools:
  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config: &online_visual_tool
      base_url: ${oc.env:VISUAL_TOOL_API_BASES,http://127.0.0.1:9000}
      api_key: ${oc.env:VISUAL_TOOL_API_KEY,''}
      timeout: ${oc.env:VISUAL_TOOL_TIMEOUT,300}
      max_retries: ${oc.env:VISUAL_TOOL_MAX_RETRIES,2}
    tool_schema:
      type: function
      function:
        name: crop_zoom
        description: Crop a region selected with Qwen3-VL relative coordinates without resampling.
        parameters:
          type: object
          properties:
            bbox_2d:
              type: array
              items:
                type: number
                minimum: 0
                maximum: 1000
              minItems: 4
              maxItems: 4
              description: Relative [x1, y1, x2, y2] coordinates in the independent 0-1000 coordinate system of target_image.
            target_image:
              type: integer
              description: Zero-based index into the sample images array.
            label:
              type: string
              description: Optional label for the selected region.
            slack_ratio:
              type: number
              minimum: 0
              default: 0.1
              description: Extra context around the bounding box; defaults to 0.1 (10%).
          required: [bbox_2d, target_image]

  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config: *online_visual_tool
    tool_schema:
      type: function
      function:
        name: grounding_detect
        description: Detect one concrete object; returned boxes use the independent 0-1000 coordinate system of target_image.
        parameters:
          type: object
          properties:
            query:
              type: string
              description: Short noun phrase of at most 12 words for a concrete, visually identifiable object; never include the full question or reasoning.
            target_image:
              type: integer
              description: Zero-based index into the sample images array.
          required: [query, target_image]
