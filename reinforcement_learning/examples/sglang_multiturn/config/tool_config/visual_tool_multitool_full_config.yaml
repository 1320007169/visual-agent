tools:
  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config: &online_visual_tool
      base_url: ${oc.env:VISUAL_TOOL_API_BASES,http://127.0.0.1:9000}
      api_key: ${oc.env:VISUAL_TOOL_API_KEY,''}
      timeout: ${oc.env:VISUAL_TOOL_TIMEOUT,300}
      max_retries: ${oc.env:VISUAL_TOOL_MAX_RETRIES,2}
    tool_schema:
      type: function
      function:
        name: grounding_detect
        description: Detect one concrete object and return relative 0-1000 boxes.
        parameters:
          type: object
          properties:
            query: {type: string, description: Short concrete object noun phrase.}
            target_image: {type: integer, description: Zero-based image index.}
          required: [query, target_image]

  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config: *online_visual_tool
    tool_schema:
      type: function
      function:
        name: crop_zoom
        description: Crop a region using relative 0-1000 coordinates.
        parameters:
          type: object
          properties:
            bbox_2d:
              type: array
              items: {type: number, minimum: 0, maximum: 1000}
              minItems: 4
              maxItems: 4
            target_image: {type: integer, description: Zero-based image index.}
            label: {type: string, description: Optional region label.}
          required: [bbox_2d, target_image]

  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config: *online_visual_tool
    tool_schema:
      type: function
      function:
        name: depth_measure
        description: Return median depth_m for one or more boxes in the same image.
        parameters:
          type: object
          properties:
            bboxes_2d:
              type: array
              items:
                type: array
                items: {type: number, minimum: 0, maximum: 1000}
                minItems: 4
                maxItems: 4
              minItems: 1
            target_image: {type: integer, description: Zero-based image index.}
          required: [bboxes_2d, target_image]

  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config: *online_visual_tool
    tool_schema:
      type: function
      function:
        name: object_count
        description: Count instances of one concrete object category.
        parameters:
          type: object
          properties:
            query: {type: string, description: Concrete object category to count.}
            target_image: {type: integer, description: Zero-based image index.}
          required: [query, target_image]

  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config: *online_visual_tool
    tool_schema:
      type: function
      function:
        name: ocr_read
        description: Read selected text or parse a chart with PaddleOCR-VL-1.6. Returns text without answering the question.
        parameters:
          type: object
          properties:
            target_image: {type: integer, minimum: 0, description: Zero-based image index.}
            bbox_2d:
              type: array
              items: {type: number, minimum: 0, maximum: 1000}
              minItems: 4
              maxItems: 4
              description: Optional reading area on target_image; omit for the whole image.
            mode: {type: string, enum: [text, chart], description: Use text for ordinary OCR or chart for chart data.}
          required: [target_image]
          additionalProperties: false

  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config:
      base_url: ${oc.env:VISUAL_TOOL_API_BASES,http://127.0.0.1:9000}
      api_key: ${oc.env:VISUAL_TOOL_API_KEY,''}
      timeout: ${oc.env:VISUAL_TOOL_TIMEOUT,300}
      max_retries: ${oc.env:VISUAL_TOOL_MAX_RETRIES,2}
    tool_schema:
      type: function
      function:
        name: image_resize
        description: Resize using width and height, or max_side preserving aspect ratio.
          Returns a new image index.
        parameters:
          type: object
          properties:
            target_image: &id001
              type: integer
              minimum: 0
              description: Zero-based input image index.
            width:
              type: integer
              minimum: 1
            height:
              type: integer
              minimum: 1
            max_side:
              type: integer
              minimum: 1
          required:
          - target_image
          additionalProperties: false
  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config:
      base_url: ${oc.env:VISUAL_TOOL_API_BASES,http://127.0.0.1:9000}
      api_key: ${oc.env:VISUAL_TOOL_API_KEY,''}
      timeout: ${oc.env:VISUAL_TOOL_TIMEOUT,300}
      max_retries: ${oc.env:VISUAL_TOOL_MAX_RETRIES,2}
    tool_schema:
      type: function
      function:
        name: image_enhance
        description: Adjust contrast, sharpness, brightness, gamma or denoise. Factors
          default to 1. Returns a new image index.
        parameters:
          type: object
          properties:
            target_image: *id001
            contrast: &id002
              type: number
              minimum: 0
              maximum: 4
            sharpness: *id002
            brightness: *id002
            gamma:
              type: number
              exclusiveMinimum: 0
              maximum: 4
            denoise:
              type: boolean
          required:
          - target_image
          additionalProperties: false
  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config:
      base_url: ${oc.env:VISUAL_TOOL_API_BASES,http://127.0.0.1:9000}
      api_key: ${oc.env:VISUAL_TOOL_API_KEY,''}
      timeout: ${oc.env:VISUAL_TOOL_TIMEOUT,300}
      max_retries: ${oc.env:VISUAL_TOOL_MAX_RETRIES,2}
    tool_schema:
      type: function
      function:
        name: image_rotate
        description: Rotate counterclockwise by angle in degrees. expand defaults to
          true. Returns a new image index.
        parameters:
          type: object
          properties:
            target_image: *id001
            angle:
              type: number
              minimum: -360
              maximum: 360
            expand:
              type: boolean
          required:
          - target_image
          - angle
          additionalProperties: false
  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config:
      base_url: ${oc.env:VISUAL_TOOL_API_BASES,http://127.0.0.1:9000}
      api_key: ${oc.env:VISUAL_TOOL_API_KEY,''}
      timeout: ${oc.env:VISUAL_TOOL_TIMEOUT,300}
      max_retries: ${oc.env:VISUAL_TOOL_MAX_RETRIES,2}
    tool_schema:
      type: function
      function:
        name: image_flip
        description: Flip horizontally, vertically or both. Returns a new image index.
        parameters:
          type: object
          properties:
            target_image: *id001
            direction:
              type: string
              enum:
              - horizontal
              - vertical
              - both
          required:
          - target_image
          - direction
          additionalProperties: false
  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config:
      base_url: ${oc.env:VISUAL_TOOL_API_BASES,http://127.0.0.1:9000}
      api_key: ${oc.env:VISUAL_TOOL_API_KEY,''}
      timeout: ${oc.env:VISUAL_TOOL_TIMEOUT,300}
      max_retries: ${oc.env:VISUAL_TOOL_MAX_RETRIES,2}
    tool_schema:
      type: function
      function:
        name: image_draw
        description: Draw boxes, points or lines in relative 0-1000 coordinates. width
          is in pixels. Returns a new image index.
        parameters:
          type: object
          properties:
            target_image: *id001
            boxes:
              type: array
              items: &id004
                type: array
                items: &id003
                  type: number
                  minimum: 0
                  maximum: 1000
                minItems: 4
                maxItems: 4
            points:
              type: array
              items:
                type: array
                items: *id003
                minItems: 2
                maxItems: 2
            lines:
              type: array
              items: *id004
            color:
              type: string
              description: Pillow color name or hex color.
            width:
              type: integer
              minimum: 1
              maximum: 32
          required:
          - target_image
          additionalProperties: false
  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config:
      base_url: ${oc.env:VISUAL_TOOL_API_BASES,http://127.0.0.1:9000}
      api_key: ${oc.env:VISUAL_TOOL_API_KEY,''}
      timeout: ${oc.env:VISUAL_TOOL_TIMEOUT,300}
      max_retries: ${oc.env:VISUAL_TOOL_MAX_RETRIES,2}
    tool_schema:
      type: function
      function:
        name: sam_segment
        description: Segment one relative 0-1000 box with SAM3. Returns mask and overlay
          image indices, score and area.
        parameters:
          type: object
          properties:
            target_image: *id001
            bbox_2d: *id004
          required:
          - target_image
          - bbox_2d
          additionalProperties: false
  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config:
      base_url: ${oc.env:VISUAL_TOOL_API_BASES,http://127.0.0.1:9000}
      api_key: ${oc.env:VISUAL_TOOL_API_KEY,''}
      timeout: ${oc.env:VISUAL_TOOL_TIMEOUT,300}
      max_retries: ${oc.env:VISUAL_TOOL_MAX_RETRIES,2}
    tool_schema:
      type: function
      function:
        name: bbox_geometry
        description: Compare two relative 0-1000 boxes on the same image. Returns image-plane
          relations, IoU and center distance in pixels; does not determine depth.
        parameters:
          type: object
          properties:
            target_image: *id001
            bbox_a: *id004
            bbox_b: *id004
          required:
          - target_image
          - bbox_a
          - bbox_b
          additionalProperties: false
