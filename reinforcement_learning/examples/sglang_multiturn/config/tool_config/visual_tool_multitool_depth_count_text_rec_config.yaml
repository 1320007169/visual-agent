tools:
  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config: &online_visual_tool
      base_url: ${oc.env:VISUAL_TOOL_API_BASES,http://127.0.0.1:9000}
      api_key: ${oc.env:VISUAL_TOOL_API_KEY,''}
      timeout: ${oc.env:VISUAL_TOOL_TIMEOUT,300}
      max_retries: ${oc.env:VISUAL_TOOL_MAX_RETRIES,2}
    tool_schema:
      type: function
      function:
        name: grounding_detect
        description: Detect one concrete object and return relative 0-1000 boxes.
        parameters:
          type: object
          properties:
            query: {type: string, description: Short concrete object noun phrase.}
            target_image: {type: integer, description: Zero-based image index.}
          required: [query, target_image]

  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config: *online_visual_tool
    tool_schema:
      type: function
      function:
        name: crop_zoom
        description: Crop a region using relative 0-1000 coordinates.
        parameters:
          type: object
          properties:
            bbox_2d:
              type: array
              items: {type: number, minimum: 0, maximum: 1000}
              minItems: 4
              maxItems: 4
            target_image: {type: integer, description: Zero-based image index.}
            label: {type: string, description: Optional region label.}
          required: [bbox_2d, target_image]

  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config: *online_visual_tool
    tool_schema:
      type: function
      function:
        name: depth_measure
        description: Return regions with bbox_2d and median depth_m for one or more located boxes in the same image.
        parameters:
          type: object
          properties:
            bboxes_2d:
              type: array
              items:
                type: array
                items: {type: number, minimum: 0, maximum: 1000}
                minItems: 4
                maxItems: 4
              minItems: 1
            target_image: {type: integer, description: Zero-based image index.}
          required: [bboxes_2d, target_image]

  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config: *online_visual_tool
    tool_schema:
      type: function
      function:
        name: object_count
        description: Count instances of one concrete object category.
        parameters:
          type: object
          properties:
            query: {type: string, description: Concrete object category to count.}
            target_image: {type: integer, description: Zero-based image index.}
          required: [query, target_image]

  - class_name: verl.tools.visual_tool.OnlineVisualTool
    config: *online_visual_tool
    tool_schema:
      type: function
      function:
        name: text_recognize
        description: Read selected relative 0-1000 boxes without running detection; return regions with bbox_2d and text.
        parameters:
          type: object
          properties:
            bboxes_2d:
              type: array
              items:
                type: array
                items: {type: number, minimum: 0, maximum: 1000}
                minItems: 4
                maxItems: 4
              minItems: 1
            target_image: {type: integer, description: Zero-based image index.}
          required: [bboxes_2d, target_image]
